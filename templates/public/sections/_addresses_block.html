{% if addresses %}
<ul class="list-unstyled">
    {% for addr in addresses %}
    <li class="mb-3">
        <span class="text-muted small d-block">Адрес</span>
        <strong>{{ addr.name }}</strong>
        {% if addr.address %}
        <br>{{ addr.address }}
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endif %}
